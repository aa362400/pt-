<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ozon Public Evidence Capture</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <header>
      <h1>Ozon Public Evidence</h1>
      <button id="openOptions" class="icon-button" title="Connection settings" aria-label="Open connection settings">⚙</button>
    </header>
    <p class="muted">Only reads public products visible on the current page. It does not read cookies, account data or auto-paginate backend pages.</p>
    <div class="actions">
      <button id="capture" class="primary">Read current page</button>
      <button id="upload" disabled>Confirm and submit</button>
    </div>
    <div id="status" class="status" role="status"></div>
    <section id="summary" class="summary hidden" aria-live="polite">
      <dl>
        <div><dt>Page</dt><dd id="pageTitle">-</dd></div>
        <div><dt>Items</dt><dd id="itemCount">0</dd></div>
        <div><dt>Confidence</dt><dd id="confidence">0</dd></div>
      </dl>
      <ul id="preview"></ul>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
