<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopMate Connection Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-body">
    <main>
      <h1>Local Connection Settings</h1>
      <p class="muted">The access token is stored only in this browser extension's local storage. Do not paste model keys or Ozon seller keys here.</p>
      <label for="apiBase">ShopMate API URL</label>
      <input id="apiBase" type="url" value="http://127.0.0.1:3000/api/v1" />
      <label for="accessToken">Current account access token</label>
      <input id="accessToken" type="password" autocomplete="off" />
      <div class="actions">
        <button id="save" class="primary">Save settings</button>
        <button id="clear">Clear token</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
