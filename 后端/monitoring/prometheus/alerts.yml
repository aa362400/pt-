groups:
  - name: shopmate-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Error rate > 5% for 2 minutes" }

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "P95 latency > 500ms" }

      - alert: QueueBacklog
        expr: sum(bullmq_jobs_waiting{queue=~".+"}) > 50
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Queue backlog > 50 jobs" }

      - alert: InstanceDown
        expr: up{job="shopmate-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Backend instance down" }
