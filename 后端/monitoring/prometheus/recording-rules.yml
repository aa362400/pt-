groups:
  - name: shopmate-slo-recording
    interval: 30s
    rules:
      - record: shopmate:http_requests:rate5m
        expr: sum(rate(http_requests_total[5m]))

      - record: shopmate:http_5xx:rate5m
        expr: sum(rate(http_requests_total{status="5xx"}[5m]))

      - record: shopmate:http_error_ratio:5m
        expr: shopmate:http_5xx:rate5m / clamp_min(shopmate:http_requests:rate5m, 0.000001)

      - record: shopmate:http_error_ratio:1h
        expr: sum(rate(http_requests_total{status="5xx"}[1h])) / clamp_min(sum(rate(http_requests_total[1h])), 0.000001)

      - record: shopmate:http_availability_ratio:30d
        expr: 1 - (sum(increase(http_requests_total{status="5xx"}[30d])) / clamp_min(sum(increase(http_requests_total[30d])), 1))

      - record: shopmate:http_latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))

      - record: shopmate:agent_terminal_total:14d
        expr: sum(increase(agent_runs_total{status=~"completed|failed"}[14d]))

      - record: shopmate:agent_run_success_ratio:14d
        expr: sum(increase(agent_runs_total{status="completed"}[14d])) / clamp_min(shopmate:agent_terminal_total:14d, 1)

      - record: shopmate:agent_quality_samples:14d
        expr: sum(increase(agent_run_quality_total{result=~"pass|fail"}[14d]))

      - record: shopmate:agent_quality_pass_ratio:14d
        expr: sum(increase(agent_run_quality_total{result="pass"}[14d])) / clamp_min(shopmate:agent_quality_samples:14d, 1)

      - record: shopmate:queue_backlog
        expr: sum(bullmq_jobs_waiting + bullmq_jobs_delayed)

      - record: shopmate:http_error_budget_remaining_ratio:30d
        expr: clamp_min(clamp_max(1 - ((1 - shopmate:http_availability_ratio:30d) / 0.001), 1), 0)

      - record: shopmate:http_error_budget_burn_rate:5m
        expr: shopmate:http_error_ratio:5m / 0.001

      - record: shopmate:http_error_budget_burn_rate:1h
        expr: shopmate:http_error_ratio:1h / 0.001

      - record: job:agent_run_success_rate:14d
        expr: shopmate:agent_run_success_ratio:14d

      - record: job:agent_run_quality_pass_rate:14d
        expr: shopmate:agent_quality_pass_ratio:14d

      - record: job:agent_run_error_budget_remaining_ratio:14d
        expr: clamp_min(clamp_max(1 - ((1 - shopmate:agent_run_success_ratio:14d) / 0.02), 1), 0)
