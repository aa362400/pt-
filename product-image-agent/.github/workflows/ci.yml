name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r agent/requirements.txt pytest

      - name: Install jsdom (DOM smoke tests)
        run: npm install jsdom --prefix .tmp-jsdom

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest agent/tests -q
