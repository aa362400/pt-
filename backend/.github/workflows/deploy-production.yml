name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image tag produced by a passing release build
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      PRODUCTION_DEPLOY_WEBHOOK: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}
      PRODUCTION_DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
      PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
    steps:
      - name: Require real deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in REGISTRY_HOST REGISTRY_USER REGISTRY_PASSWORD PRODUCTION_DEPLOY_WEBHOOK PRODUCTION_DEPLOY_TOKEN PRODUCTION_HEALTH_URL; do
            test -n "${!name:-}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done
      - name: Verify immutable image exists
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="$REGISTRY_HOST/shopmate/backend:$VERSION"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin
          docker pull "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Trigger production deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $PRODUCTION_DEPLOY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"image\":\"$IMAGE\",\"environment\":\"production\"}" \
            "$PRODUCTION_DEPLOY_WEBHOOK"
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PRODUCTION_HEALTH_URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production health check did not pass within five minutes.' >&2
          exit 1
