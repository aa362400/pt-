# ============================================================
# nginx.conf — ShopMate AI Production Reverse Proxy
# Routes requests to the appropriate services:
#   / → Frontend (React SPA)
#   /api/ → Backend (NestJS API)
#   /agent/ → Python Agent (Product Image Agent)
# ============================================================

upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:3000;
}

upstream agent {
    server agent:8080;
}

server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Security headers (from included config)
    include /etc/nginx/security-headers.conf;

    # Increase max body size for image uploads (agent may handle large files)
    client_max_body_size 50M;

    # ---- API Proxy ----
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ---- Python Agent Proxy ----
    location /agent/ {
        rewrite ^/agent/(.*) /$1 break;
        proxy_pass http://agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for image processing
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Frontend SPA ----
    # Static assets: long cache + proxy to the frontend container
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
