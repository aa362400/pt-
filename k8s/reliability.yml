apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopmate-backend-pdb
  namespace: shopmate
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: shopmate-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopmate-agent-pdb
  namespace: shopmate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: shopmate-agent
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopmate-agent-hpa
  namespace: shopmate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopmate-agent
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
