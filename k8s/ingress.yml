apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopmate-ingress
  namespace: shopmate
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.shopmate.ai
      secretName: shopmate-tls
  rules:
    - host: app.shopmate.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopmate-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: shopmate-backend
                port:
                  number: 3000
