apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopmate-agent
  namespace: shopmate
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shopmate-agent
  template:
    metadata:
      labels:
        app: shopmate-agent
    spec:
      containers:
        - name: agent
          image: shopmate/agent:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: shopmate-env
          env:
            - name: AGENT_RUNTIME_DIR
              value: /data/runtime
            - name: AGENT_LOG_DIR
              value: /data/runtime/logs
            - name: AGENT_STATE_MODE
              value: redis
            - name: AGENT_REPLICA_COUNT
              value: "2"
            - name: AGENT_REDIS_URL
              value: redis://shopmate-redis:6379/1
          volumeMounts:
            - name: agent-runtime
              mountPath: /data/runtime
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: agent-runtime
          persistentVolumeClaim:
            claimName: shopmate-agent-runtime-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shopmate-agent-runtime-pvc
  namespace: shopmate
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: shopmate-agent
  namespace: shopmate
spec:
  selector:
    app: shopmate-agent
  ports:
    - port: 8080
      targetPort: 8080
