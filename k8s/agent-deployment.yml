apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopmate-agent
  namespace: shopmate
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shopmate-agent
  template:
    metadata:
      labels:
        app: shopmate-agent
    spec:
      containers:
        - name: agent
          image: shopmate/agent:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: shopmate-env
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: shopmate-agent
  namespace: shopmate
spec:
  selector:
    app: shopmate-agent
  ports:
    - port: 8080
      targetPort: 8080
