apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopmate-backend
  namespace: shopmate
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shopmate-backend
  template:
    metadata:
      labels:
        app: shopmate-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/v1/metrics
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: backend
          image: shopmate/backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: shopmate-env
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopmate-backend
  namespace: shopmate
spec:
  selector:
    app: shopmate-backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopmate-backend-hpa
  namespace: shopmate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopmate-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
