apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopmate-frontend
  namespace: shopmate
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shopmate-frontend
  template:
    metadata:
      labels:
        app: shopmate-frontend
    spec:
      containers:
        - name: frontend
          image: shopmate/frontend:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopmate-frontend
  namespace: shopmate
spec:
  selector:
    app: shopmate-frontend
  ports:
    - port: 80
      targetPort: 80
