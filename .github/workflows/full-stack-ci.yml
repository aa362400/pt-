name: Full Stack Release Gate

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  full-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopmate
          POSTGRES_PASSWORD: shopmate_test
          POSTGRES_DB: shopmate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shopmate -d shopmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shopmate:shopmate_test@localhost:5432/shopmate_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-access-secret-key-minimum-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-key-minimum-32-characters
      JWT_2FA_TEMP_SECRET: ci-two-factor-secret-key-minimum-32-chars
      ENCRYPTION_KEY: ci-encryption-key-not-for-production
      AGENT_ALLOW_MOCK: 'false'
      AUTOMATION_SCHEDULER_INTERVAL_MS: '0'
      OZON_ORDER_SYNC_INTERVAL_MS: '0'
      COMMERCE_AGENT_PYTHON: python
      COMMERCE_AGENT_MCP_SERVER: ${{ github.workspace }}/电商设计图保持产品一致性智能体/agent/mcp_server.py
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            后端/pnpm-lock.yaml
            智能体前端/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 电商设计图保持产品一致性智能体/agent/requirements.txt
      - name: Install backend
        working-directory: 后端
        run: pnpm install --frozen-lockfile
      - name: Install frontend
        working-directory: 智能体前端
        run: pnpm install --frozen-lockfile
      - name: Install Agent
        run: python -m pip install -r "电商设计图保持产品一致性智能体/agent/requirements.txt" pytest
      - name: Apply database migrations
        working-directory: 后端
        run: pnpm exec prisma migrate deploy
      - name: Generate Prisma client
        working-directory: 后端
        run: pnpm exec prisma generate
      - name: Enterprise critical-path static check
        working-directory: 后端
        run: >-
          pnpm exec eslint
          src/cli/bootstrap-local-encryption-key.ts
          src/cli/ozon-readonly-regression.ts
          src/cli/rotate-ozon-credentials.ts
          src/features/agent-proxy/agent-capability-token.dto.ts
          src/features/agent-proxy/agent-capability-token.service.ts
          src/features/agent-proxy/agent-proxy.controller.ts
          src/features/agent-runs/agent-run-outbox.publisher.ts
          src/features/channels/ozon-external-write.service.ts
          src/features/channels/ozon-credentials.service.ts
          src/features/enterprise-slo/*.ts
          src/shared/audit/audit.service.ts
      - name: Backend build
        working-directory: 后端
        run: pnpm run build
      - name: Backend tests
        working-directory: 后端
        run: pnpm test -- --runInBand
      - name: Agent tests
        working-directory: 电商设计图保持产品一致性智能体
        run: python -m pytest -q -p no:cacheprovider agent/tests
      - name: Frontend lint
        working-directory: 智能体前端
        run: pnpm run lint
      - name: Frontend build
        working-directory: 智能体前端
        run: pnpm run build
