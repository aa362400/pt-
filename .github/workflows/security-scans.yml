name: Security Scans

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript, python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend dependency audit
        working-directory: ./后端
        run: |
          corepack enable
          pnpm audit --audit-level=high || echo "::warning::pnpm audit found vulnerabilities in backend"

      - name: Frontend dependency audit
        working-directory: ./智能体前端
        run: |
          corepack enable
          pnpm audit --audit-level=high || echo "::warning::pnpm audit found vulnerabilities in frontend"

  headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check nginx security headers
        run: |
          if [ -f "nginx/security-headers.conf" ]; then
            echo "✅ nginx/security-headers.conf exists"
            grep -q "X-Frame-Options" nginx/security-headers.conf && echo "  ✅ X-Frame-Options" || echo "  ❌ X-Frame-Options missing"
            grep -q "X-Content-Type-Options" nginx/security-headers.conf && echo "  ✅ X-Content-Type-Options" || echo "  ❌ X-Content-Type-Options missing"
            grep -q "Strict-Transport-Security" nginx/security-headers.conf && echo "  ✅ HSTS" || echo "  ❌ HSTS missing"
            grep -q "Content-Security-Policy" nginx/security-headers.conf && echo "  ✅ CSP" || echo "  ❌ CSP missing"
            grep -q "Referrer-Policy" nginx/security-headers.conf && echo "  ✅ Referrer-Policy" || echo "  ❌ Referrer-Policy missing"
            echo ""
            echo "✅ All checks passed"
          else
            echo "⚠️ nginx/security-headers.conf not found"
          fi
